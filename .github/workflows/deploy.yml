# Builds and deploys thehaps.app to GitHub Pages.
#
# Pages is on "GitHub Actions" deploy (not branch deploy) so the ~25k+
# generated /event/{id}/ pages live only in the build artifact and never
# bloat the repo. Every push to main redeploys; the nightly cron regenerates
# event pages after the scraper daily-pipeline (09:00 UTC) has finished.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 12:00 UTC (6am MT) — after the haps-scraper daily pipeline.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.wrangler' \
            --exclude='scripts' --exclude='node_modules' \
            ./ /tmp/site/
      # Reuse the previous run's fetched dataset so pushes don't re-hit Supabase.
      # Only scheduled/manual runs refresh it (SEO_FORCE_REFRESH below), so the
      # ~28k-row fetch happens once a day instead of on every push to main —
      # this is the main lever keeping egress under the free-tier quota.
      - name: Restore SEO dataset cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/seo-cache
          key: seo-data-${{ github.run_id }}
          restore-keys: |
            seo-data-
      - name: Generate event pages + sitemap
        env:
          # Force a live fetch on cron + manual runs; reuse cache on pushes.
          SEO_FORCE_REFRESH: ${{ github.event_name != 'push' && '1' || '0' }}
        run: node scripts/generate-event-pages.mjs --site /tmp/site --cache /tmp/seo-cache/events.json
      - name: Save SEO dataset cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/seo-cache
          key: seo-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
