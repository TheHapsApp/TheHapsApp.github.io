# Builds and deploys thehaps.app to GitHub Pages.
#
# Pages is on "GitHub Actions" deploy (not branch deploy) so the ~25k+
# generated /event/{id}/ pages live only in the build artifact and never
# bloat the repo. Every push to main redeploys; the nightly cron regenerates
# event pages after the scraper daily-pipeline (09:00 UTC) has finished.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily at 12:00 UTC (6am MT) — after the haps-scraper daily pipeline.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble site
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.wrangler' \
            --exclude='scripts' --exclude='node_modules' \
            ./ /tmp/site/
      # Reuse the previous run's fetched dataset so pushes don't re-hit Supabase.
      # Only scheduled/manual runs refresh it (SEO_FORCE_REFRESH below), so the
      # ~28k-row fetch happens once a day instead of on every push to main —
      # this is the main lever keeping egress under the free-tier quota.
      - name: Restore SEO dataset cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/seo-cache
          key: seo-data-${{ github.run_id }}
          restore-keys: |
            seo-data-
      - name: Generate event pages + sitemap
        env:
          # Force a live fetch on cron + manual runs; reuse cache on pushes.
          SEO_FORCE_REFRESH: ${{ github.event_name != 'push' && '1' || '0' }}
        run: node scripts/generate-event-pages.mjs --site /tmp/site --cache /tmp/seo-cache/events.json --indexnow-out /tmp/indexnow-urls.txt
      - name: Save SEO dataset cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/seo-cache
          key: seo-data-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - name: Keep changed-URL list for IndexNow
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: /tmp/indexnow-urls.txt
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing/Yandex/Seznam (and ChatGPT search, which reads Bing's index)
  # about pages whose content changed this build, once they're live. The key
  # file c2be4fe4a159c8e4100ddc16c88b965b.txt at the site root proves we own
  # the host; IndexNow keys are public by design. Non-fatal: a failed ping
  # must never fail the deploy.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Submit changed URLs
        continue-on-error: true
        run: |
          n=$(grep -c . indexnow-urls.txt || true)
          echo "$n changed URLs"
          [ "$n" -gt 0 ] || exit 0
          jq -R . indexnow-urls.txt | jq -s '{host: "thehaps.app", key: "c2be4fe4a159c8e4100ddc16c88b965b", keyLocation: "https://thehaps.app/c2be4fe4a159c8e4100ddc16c88b965b.txt", urlList: .}' > body.json
          curl -sS -o resp.txt -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json | tee code.txt
          cat resp.txt; echo
          grep -qE '^20[02]$' code.txt

  # GitHub disables scheduled workflows after 60 days without a commit to the
  # repo. That froze this site on 2026-10-14 (last commit 2026-08-15): event
  # pages + sitemap stopped regenerating and Google traffic fell ~90%.
  # Re-enabling the workflow through the API on every nightly run resets the
  # inactivity timer, so it can't lapse again while the cron keeps firing.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Reset the 60-day inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
