<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Haps</title>
<meta name="description" content="View this event on Haps.">
<link rel="icon" href="/assets/icon-512.png">
<meta name="apple-itunes-app" content="app-id=6775696204">
<link rel="stylesheet" href="/styles.css?v=9">
<script>
  // Shared /event/{id} links: if the app is installed the OS opens it directly
  // (universal/app links) and this page is never seen. Otherwise show the
  // event on the web — the /events browser opens it in its detail view.
  (function () {
    var m = location.pathname.match(/\/event\/([A-Za-z0-9\-]+)/);
    var id = (m && m[1]) || new URLSearchParams(location.search).get('id') || '';
    if (id) {
      document.querySelector('meta[name="apple-itunes-app"]')
        .setAttribute('content', 'app-id=6775696204, app-argument=https://thehaps.app/event/' + id);
      location.replace('/#e=' + encodeURIComponent(id));
    }
  })();
</script>
<script src="/assets/analytics.js"></script>
</head>
<body>
  <div class="event-wrap">
    <img class="symbol" src="/assets/icon-512.png" alt="Haps">
    <h1 style="color:var(--ink);font-size:1.5rem;margin:.2rem 0 .4rem">Opening this event…</h1>
    <p style="color:var(--muted);margin-top:0">Taking you to the event on thehaps.app.</p>
    <a class="btn btn-primary" href="/">Browse all events</a>
    <a class="btn btn-ghost" href="/beta">Get the Haps app</a>
    <p style="margin-top:1.5rem"><a href="/">← Back to thehaps.app</a></p>
  </div>
</body>
</html>
